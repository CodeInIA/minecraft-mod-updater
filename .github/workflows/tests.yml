name: Tests

# Runs the test suite on Windows, macOS and Linux:
#   - on every push to dev and on pull requests to main, to catch problems early
#   - from the release workflow, which only builds and publishes if these pass

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          check-latest: true
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: ruff check --output-format=github .

      - name: mypy
        run: mypy

  tests:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          check-latest: true
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade -r requirements.txt -r requirements-dev.txt

      # The window tests need a display; Linux runners get a virtual one.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a python -m pytest -v

      - name: Run tests
        if: runner.os != 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pytest -v
