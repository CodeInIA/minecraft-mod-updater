name: Build & Release

# Every push to main builds the app for Windows, macOS and Linux and publishes
# a new GitHub release (vMAJOR.MINOR.PATCH) with:
#   - MinecraftModUpdater_Setup.exe      Windows installer (Inno Setup)
#   - MinecraftModUpdater_macOS.dmg      macOS app (Apple Silicon)
#   - MinecraftModUpdater_Linux.tar.gz   Linux x64 app + install.sh
# The version is computed from the latest vX.Y.Z tag, nothing is hard-coded:
#   - by default the patch number goes up:        v2.0.3 -> v2.0.4
#   - "#minor" in a pushed commit message:          v2.0.4 -> v2.1.0
#   - "#major" in a pushed commit message:          v2.1.0 -> v3.0.0
# When run by hand (Actions -> Run workflow) the bump can be chosen.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version number to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Next version from existing tags
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/v||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          bump="$BUMP"
          if [ -z "$bump" ]; then
            messages=$(jq -r '.commits[]?.message // empty' "$GITHUB_EVENT_PATH")
            if grep -qi '#major' <<< "$messages"; then bump=major
            elif grep -qi '#minor' <<< "$messages"; then bump=minor
            else bump=patch; fi
          fi
          if [ -z "$latest" ]; then
            next=1.0.0
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$bump" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *)     next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Latest tag: v${latest:-none} | bump: $bump | new version: v$next"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            # Older Ubuntu = older glibc, so the binary runs on more distros.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # Newest Python 3.14.x patch release; bump the minor version manually.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          check-latest: true
          cache: pip

      - name: Install dependencies
        run: |
          python --version
          pip install --upgrade -r requirements.txt pyinstaller

      - name: Write version file
        shell: bash
        run: echo "VERSION = \"$APP_VERSION\"" > app_version.py

      - name: Build app
        run: pyinstaller --noconfirm mod_updater.spec

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName "/DMyAppVersion=$env:APP_VERSION" installer-script.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Move-Item installer/MinecraftModUpdater_Setup.exe release/

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg release
          cp -R "dist/Minecraft Mod Updater.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Minecraft Mod Updater" -srcfolder dmg -ov -format UDZO release/MinecraftModUpdater_macOS.dmg

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/MinecraftModUpdater release
          cp -R dist/mod_updater pkg/MinecraftModUpdater/
          cp packaging/linux/install.sh LICENSE pkg/MinecraftModUpdater/
          chmod +x pkg/MinecraftModUpdater/install.sh pkg/MinecraftModUpdater/mod_updater/mod_updater
          tar -czf release/MinecraftModUpdater_Linux.tar.gz -C pkg MinecraftModUpdater

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Minecraft Mod Updater v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: release/*
          body: |
            ## Descargas / Downloads
            | Sistema | Archivo |
            |---|---|
            | Windows | `MinecraftModUpdater_Setup.exe`: ejecuta el instalador |
            | macOS (Apple Silicon) | `MinecraftModUpdater_macOS.dmg`: arrastra la app a Aplicaciones. La primera vez: clic derecho → Abrir (o Ajustes → Privacidad y seguridad → Abrir igualmente) |
            | Linux x64 | `MinecraftModUpdater_Linux.tar.gz`: descomprime y ejecuta `./install.sh` |

            No necesitas tener Python instalado. / Python is not required.
