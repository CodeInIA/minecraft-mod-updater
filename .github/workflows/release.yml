name: Build & Release

# Work happens on the dev branch. Every push to main (i.e. merging dev into main)
# runs the tests, builds the app for Windows, macOS and Linux, checks that each
# packaged app starts, and only then publishes a new GitHub release with:
#   - MinecraftModUpdater_Setup.exe      Windows installer (Inno Setup)
#   - MinecraftModUpdater_macOS.dmg      macOS app (Apple Silicon)
#   - MinecraftModUpdater_Linux.tar.gz   Linux x64 app + install.sh
# The version is computed from the latest vX.Y.Z tag, nothing is hard-coded:
#   - by default the patch number goes up:        v2.0.3 -> v2.0.4
#   - "#minor" in a commit message since the last release:   v2.0.4 -> v2.1.0
#   - "#major" in a commit message since the last release:   v2.1.0 -> v3.0.0
# When run by hand (Actions -> Run workflow) the bump can be chosen.
# A release is only published when something that ends up in the app changed since
# the last one: pushes that only touch documentation, tests or CI files run the tests
# and stop there. Running the workflow by hand always publishes.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version number to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  version:
    name: Compute version
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history and tags

      - name: Next version from existing tags
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          bump="$BUMP"
          if [ -z "$bump" ]; then
            # Every commit since the last release, including the ones brought in by a merge
            messages=$(git log --format=%B ${latest:+"v$latest..HEAD"})
            # Only a standalone marker counts ("... #minor"), not text such as "#minor/#major"
            if grep -Eqi '(^|[[:space:]])#major([[:space:]]|$)' <<< "$messages"; then bump=major
            elif grep -Eqi '(^|[[:space:]])#minor([[:space:]]|$)' <<< "$messages"; then bump=minor
            else bump=patch; fi
          fi
          if [ -z "$latest" ]; then
            next=1.0.0
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$bump" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *)     next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest tag: v${latest:-none} | bump: $bump | new version: v$next"

      - name: Did the app change since the last release?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          LATEST: ${{ steps.next.outputs.latest }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$LATEST" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release forced (manual run or first release)."
            exit 0
          fi
          # Files that do not end up in the app: documentation, tests and CI.
          not_app='(\.md$|^docs/|^tests/|^\.github/|^\.gitignore$|^requirements-dev\.txt$)'
          app_changes=$(git diff --name-only "v$LATEST" HEAD | grep -Ev "$not_app" || true)
          if [ -n "$app_changes" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "App files changed since v$LATEST:"; echo "$app_changes"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation/tests/CI changed since v$LATEST: no release."
          fi

      - name: Changelog from commits since the last release
        id: changelog
        env:
          LATEST: ${{ steps.next.outputs.latest }}
        run: |
          python3 .github/scripts/changelog.py "$LATEST" > changelog.md
          cat changelog.md
          {
            echo "changelog<<CHANGELOG_END"
            cat changelog.md
            echo "CHANGELOG_END"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            # Older Ubuntu = older glibc, so the binary runs on more distros.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # Newest Python 3.14.x patch release; bump the minor version manually.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          check-latest: true
          cache: pip

      - name: Install dependencies
        run: |
          python --version
          pip install --upgrade -r requirements.txt pyinstaller

      - name: Write version file
        shell: bash
        run: echo "VERSION = \"$APP_VERSION\"" > app_version.py

      - name: Build app
        run: pyinstaller --noconfirm mod_updater.spec

      # Start every packaged app in --self-test mode: checks bundled files, translations,
      # the logo and that the window can be created.
      - name: Self-test packaged app (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          function Run-And-Wait($file, $arguments) {
            $p = Start-Process $file -ArgumentList $arguments -PassThru
            $null = $p.Handle  # keep the handle so ExitCode is available after exit
            $p.WaitForExit()
            return $p.ExitCode
          }
          $env:MMU_SELF_TEST_OUTPUT = "$env:RUNNER_TEMP\self-test.txt"
          $code = Run-And-Wait "dist\mod_updater\mod_updater.exe" "--self-test"
          Get-Content $env:MMU_SELF_TEST_OUTPUT
          if ($code -ne 0) { exit 1 }

      - name: Self-test packaged app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: '"dist/Minecraft Mod Updater.app/Contents/MacOS/mod_updater" --self-test'

      - name: Self-test packaged app (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a dist/mod_updater/mod_updater --self-test

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName "/DMyAppVersion=$env:APP_VERSION" installer-script.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Move-Item installer/MinecraftModUpdater_Setup.exe release/

      - name: Test Windows installer
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          function Run-And-Wait($file, $arguments) {
            $p = Start-Process $file -ArgumentList $arguments -PassThru
            $null = $p.Handle  # keep the handle so ExitCode is available after exit
            $p.WaitForExit()
            return $p.ExitCode
          }
          $dir = "$env:RUNNER_TEMP\mmu-install"
          $code = Run-And-Wait "release\MinecraftModUpdater_Setup.exe" @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"")
          if ($code -ne 0) { Write-Error "Installer failed: $code"; exit 1 }
          Start-Sleep 3
          Get-Process mod_updater -ErrorAction SilentlyContinue | Stop-Process -Force  # app reopened by the silent install
          $env:MMU_SELF_TEST_OUTPUT = "$env:RUNNER_TEMP\installed-self-test.txt"
          $code = Run-And-Wait "$dir\mod_updater.exe" "--self-test"
          Get-Content $env:MMU_SELF_TEST_OUTPUT
          if ($code -ne 0) { exit 1 }
          # Desktop shortcut: a silent install (= update from the app) must not create it,
          # and an update must leave an existing one untouched (recreating it moves it).
          $shortcut = Join-Path ([Environment]::GetFolderPath("CommonDesktopDirectory")) "Minecraft Mod Updater.lnk"
          if (Test-Path $shortcut) { Write-Error "A silent install created a desktop shortcut"; exit 1 }
          Set-Content $shortcut "existing shortcut"
          (Get-Item $shortcut).LastWriteTime = [datetime]"2020-01-01"
          $code = Run-And-Wait "release\MinecraftModUpdater_Setup.exe" @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"")
          if ($code -ne 0) { Write-Error "Update install failed: $code"; exit 1 }
          Start-Sleep 3
          Get-Process mod_updater -ErrorAction SilentlyContinue | Stop-Process -Force
          $item = Get-Item $shortcut
          if ((Get-Content $shortcut) -ne "existing shortcut" -or $item.LastWriteTime -ne [datetime]"2020-01-01") {
            Write-Error "The update modified the existing desktop shortcut"; exit 1
          }
          Remove-Item $shortcut
          Write-Host "Desktop shortcut left untouched by the update"
          $null = Run-And-Wait "$dir\unins000.exe" @("/VERYSILENT", "/SUPPRESSMSGBOXES")

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg release
          cp -R "dist/Minecraft Mod Updater.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Minecraft Mod Updater" -srcfolder dmg -ov -format UDZO release/MinecraftModUpdater_macOS.dmg

      - name: Test macOS disk image
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" release/MinecraftModUpdater_macOS.dmg
          "$mnt/Minecraft Mod Updater.app/Contents/MacOS/mod_updater" --self-test
          hdiutil detach "$mnt"

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/MinecraftModUpdater release
          cp -R dist/mod_updater pkg/MinecraftModUpdater/
          cp packaging/linux/install.sh LICENSE pkg/MinecraftModUpdater/
          chmod +x pkg/MinecraftModUpdater/install.sh pkg/MinecraftModUpdater/mod_updater/mod_updater
          tar -czf release/MinecraftModUpdater_Linux.tar.gz -C pkg MinecraftModUpdater

      - name: Test Linux archive and install.sh
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          test_home="$RUNNER_TEMP/test-home"
          mkdir -p "$test_home" "$RUNNER_TEMP/extract"
          tar -xzf release/MinecraftModUpdater_Linux.tar.gz -C "$RUNNER_TEMP/extract"
          HOME="$test_home" "$RUNNER_TEMP/extract/MinecraftModUpdater/install.sh"
          test -f "$test_home/.local/share/applications/minecraft-mod-updater.desktop"
          HOME="$test_home" xvfb-run -a "$test_home/.local/bin/minecraft-mod-updater" --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Minecraft Mod Updater v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: release/*
          body: |
            ${{ needs.version.outputs.changelog }}

            ## Descargas / Downloads
            | Sistema | Archivo |
            |---|---|
            | Windows | `MinecraftModUpdater_Setup.exe`: ejecuta el instalador |
            | macOS (Apple Silicon) | `MinecraftModUpdater_macOS.dmg`: arrastra la app a Aplicaciones. La primera vez: clic derecho → Abrir (o Ajustes → Privacidad y seguridad → Abrir igualmente) |
            | Linux x64 | `MinecraftModUpdater_Linux.tar.gz`: descomprime y ejecuta `./install.sh` |

            No necesitas tener Python instalado. / Python is not required.
